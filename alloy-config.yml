---
- name: ติดตั้งและตั้งค่า alloy
  hosts: all
  become: true
  gather_facts: true
  ignore_unreachable: true
  vars:
    alloy_config_path: /etc/alloy/config.alloy
    grafana_key_path: /etc/apt/keyrings/grafana.asc
  tasks:
    - name: ข้ามเครื่องที่ไม่ใช่ Debian/Ubuntu
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: ข้ามเครื่องนี้ (ไม่ใช่ Debian/Ubuntu)"
      when: ansible_facts.os_family is defined and ansible_facts.os_family != 'Debian'

    - name: จบการทำงานของเครื่องที่ไม่ใช่ Debian/Ubuntu
      ansible.builtin.meta: end_host
      when: ansible_facts.os_family is defined and ansible_facts.os_family != 'Debian'

    # ---------- ติดตั้ง ----------
    - name: สร้างโฟลเดอร์เก็บ key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: ดาวน์โหลด GPG key ของ Grafana
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: "{{ grafana_key_path }}"
        mode: "0644"

    - name: เพิ่ม repository ของ Grafana
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ grafana_key_path }}] https://apt.grafana.com stable main"
        filename: grafana
        state: present
        update_cache: true

    - name: ติดตั้ง alloy, net-tools, glances
      ansible.builtin.apt:
        name:
          - alloy
          - net-tools
          - glances
        state: present

    # ---------- ตั้งค่า ----------
    - name: วางไฟล์ config (สำรองไฟล์เดิมไว้)
      ansible.builtin.copy:
        dest: "{{ alloy_config_path }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
        content: |
          logging {
            level = "warn"
          }

          prometheus.exporter.unix "node" {
            set_collectors = ["cpu", "diskstats", "filesystem", "meminfo", "netdev", "vmstat"]
            filesystem {
              fs_types_exclude = "^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|tmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
              mount_timeout    = "5s"
            }
          }

          prometheus.scrape "node" {
            scrape_interval = "15s"
            scrape_timeout  = "10s"
            targets    = prometheus.exporter.unix.node.targets
            forward_to = [prometheus.remote_write.logger.receiver]
          }

          prometheus.remote_write "logger" {
            endpoint { url = "http://10.1.0.220:8428/api/v1/write" }
          }
      register: config_result

    - name: หยุดและปิด node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: stopped
        enabled: false
      register: ne_result
      failed_when:
        - ne_result.failed | default(false)
        - "'Could not find' not in (ne_result.msg | default(''))"

    - name: enable alloy ให้เริ่มตอนเปิดเครื่อง
      ansible.builtin.systemd:
        name: alloy
        enabled: true

    - name: restart alloy เพื่อโหลด config ใหม่
      ansible.builtin.systemd:
        name: alloy
        state: restarted

    - name: รอให้ service เริ่ม
      ansible.builtin.pause:
        seconds: 5

    # ---------- ตรวจผล ----------
    - name: ตรวจสถานะ alloy หลัง restart
      ansible.builtin.systemd:
        name: alloy
      register: svc

    - name: สรุปผล
      ansible.builtin.assert:
        that: svc.status.ActiveState == 'active'
        fail_msg: "{{ inventory_hostname }}: alloy ไม่ทำงานหลัง restart ({{ svc.status.ActiveState }})"
        success_msg: "{{ inventory_hostname }}: alloy active, config {{ 'เปลี่ยน' if config_result.changed else 'ไม่เปลี่ยน' }}"
